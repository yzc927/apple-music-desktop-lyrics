name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Windows app
        run: dotnet build windows/AppleMusicDesktopLyrics.csproj -c Release

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Validate macOS metadata
        working-directory: macos
        run: plutil -lint Resources/Info.plist
      - name: Build packaged macOS app
        working-directory: macos
        run: ./scripts/build-app.sh
      - name: Run macOS core tests
        working-directory: macos
        run: swift test
