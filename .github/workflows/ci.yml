name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Windows app
        run: dotnet build windows/AppleMusicDesktopLyrics.csproj -c Release
      - name: Run Windows core tests
        run: dotnet run --project windows/CoreTests/AppleMusicDesktopLyrics.CoreTests.csproj -c Release
      - name: Publish Windows 10 and Windows 11 x64 app
        shell: pwsh
        run: ./scripts/publish-windows.ps1
      - name: Run release self-test
        shell: pwsh
        run: ./scripts/test-windows-release.ps1 artifacts/windows-x64/AppleMusicDesktopLyrics.exe

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Validate macOS metadata
        working-directory: macos
        run: plutil -lint Resources/Info.plist
      - name: Build packaged macOS app
        working-directory: macos
        run: ./scripts/build-app.sh
      - name: Run macOS core tests
        working-directory: macos
        run: swift test
